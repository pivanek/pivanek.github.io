<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pavel Ivánek – Portfolio</title>
  <meta name="description" content="Portfolio Pavla Ivánka – junior software developer. Weby, PivOS a další projekty.">
  <meta property="og:title" content="Pavel Ivánek – Portfolio">
  <meta property="og:description" content="Junior software developer. Weby, PivOS a další projekty.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="logo" href="#top" aria-label="Pavel Ivánek">pi<span>_</span></a>
      <nav class="nav">
        <a href="#websites" data-i18n="navWebsites">Weby</a>
        <a href="#projects" data-i18n="navProjects">Projekty</a>
        <a href="#skills" data-i18n="navSkills">Dovednosti</a>
        <a href="#contact" data-i18n="navContact">Kontakt</a>
      </nav>
      <div class="toggles">
        <button class="btn-icon" id="lang-toggle" type="button" data-i18n="langSwitch" data-i18n-label="langLabel">EN</button>
        <button class="btn-icon" id="theme-toggle" type="button" data-i18n-label="themeLabel">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <p class="hero__hello mono" data-i18n="heroHello">Ahoj, jsem Pavel.</p>
      <h1 class="hero__name">Pavel Ivánek</h1>
      <p class="hero__lead" data-i18n="heroLead"></p>
      <p class="hero__now mono" data-i18n="heroNow"></p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="#websites" data-i18n="heroProjects">Projekty</a>
        <a class="btn" id="cv-link" href="cv.html" target="_blank" rel="noopener" data-i18n="heroCv">Životopis</a>
        <a class="btn" id="github-link" href="https://github.com/pivanek" target="_blank" rel="noopener">GitHub</a>
      </div>
    </section>

    <section class="section wrap" id="websites">
      <div class="section__head">
        <h2 data-i18n="websitesTitle">Weby</h2>
        <p data-i18n="websitesSub"></p>
      </div>
      <div class="sites" id="sites"></div>
    </section>

    <section class="section wrap" id="projects">
      <div class="section__head">
        <h2 data-i18n="projectsTitle">Další projekty</h2>
        <p data-i18n="projectsSub"></p>
      </div>
      <div class="projects" id="project-list"></div>
    </section>

    <section class="section wrap" id="skills">
      <div class="section__head">
        <h2 data-i18n="skillsTitle">Dovednosti</h2>
        <p class="legend">
          <span class="chip chip--strong" data-i18n="legendStrong">silná stránka</span>
          <span class="chip chip--focus" data-i18n="legendFocus">aktivně rozvíjím</span>
        </p>
      </div>
      <div class="skills" id="skill-list"></div>
    </section>

    <section class="section wrap contact" id="contact">
      <h2 data-i18n="contactTitle">Kontakt</h2>
      <p data-i18n="contactLead"></p>
      <a class="contact__email" id="email-link" href="mailto:p.ivanek@icloud.com">p.ivanek@icloud.com</a>
    </section>
  </main>

  <footer class="footer wrap">
    <span>© <span id="year">2026</span> Pavel Ivánek</span>
    <span data-i18n="footer"></span>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
